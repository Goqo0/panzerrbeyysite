<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PanzerSports - Canlı Yayın</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/plyr/3.7.8/plyr.css" />
<style>
  :root {
    --bg-color: #f3f4f6;
    --surface-color: #ffffff;
    --text-main: #111827;
    --text-muted: #6b7280;
    --border-color: #e5e7eb;
    --primary: #16a34a; 
    --primary-hover: #15803d;
    --primary-light: #dcfce7;
    --player-bg: #000000;
    --plyr-color-main: #16a34a; 
  }
  [data-theme="dark"] {
    --bg-color: #0a0a0a;
    --surface-color: #171717;
    --text-main: #f9fafb;
    --text-muted: #9ca3af;
    --border-color: #262626;
    --primary: #22c55e; 
    --primary-hover: #16a34a;
    --primary-light: #064e3b;
    --player-bg: #000000;
    --plyr-color-main: #22c55e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
  body {
    background-color: var(--bg-color);
    color: var(--text-main);
    transition: background-color 0.3s, color 0.3s;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg-color); }
  ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
  header {
    background-color: var(--surface-color);
    border-bottom: 1px solid var(--border-color);
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    flex-shrink: 0;
  }
  .logo { display: flex; align-items: center; gap: 10px; font-size: 22px; }
  .logo-icon {
    background-color: var(--primary); color: white;
    width: 36px; height: 36px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 20px;
  }
  .logo-text-panzer { color: var(--text-main); font-weight: 800; letter-spacing: -0.5px; }
  .logo-text-sports { color: var(--primary); font-weight: 800; letter-spacing: -0.5px; }
  .header-actions { display: flex; align-items: center; gap: 12px; }
  google-cast-launcher {
    width: 36px; height: 36px; cursor: pointer;
    --connected-color: var(--primary);
    --disconnected-color: var(--text-muted);
  }
  .theme-btn {
    background: var(--surface-color);
    border: 1px solid var(--border-color);
    color: var(--text-main);
    width: 42px; height: 42px; border-radius: 50%;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  }
  .theme-btn:hover { background: var(--border-color); transform: scale(1.05) rotate(15deg); }
  .theme-btn svg { width: 22px; height: 22px; stroke: currentColor; }
  .container {
    display: flex; flex: 1; overflow: hidden;
    max-width: 100%; margin: 0 auto; width: 100%;
  }
  .player-section { flex: 1; padding: 32px; display: flex; flex-direction: column; overflow-y: auto; }
  .player-wrapper {
    background-color: var(--player-bg); border-radius: 16px; overflow: hidden;
    aspect-ratio: 16 / 9; position: relative; border: 1px solid var(--border-color);
    box-shadow: 0 10px 30px rgba(0,0,0,0.2); display: flex; align-items: center; justify-content: center;
  }
  .plyr { width: 100%; height: 100%; }
  .placeholder {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; color: white; gap: 16px;
    background: linear-gradient(to bottom right, #0a0a0a, #1a1a1a); z-index: 10;
  }
  .placeholder-icon {
    width: 64px; height: 64px; background: rgba(255,255,255,0.05);
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 24px; color: var(--primary);
  }
  .now-playing {
    margin-top: 20px; padding: 20px; background-color: var(--surface-color);
    border: 1px solid var(--border-color); border-radius: 16px; display: none; align-items: center; gap: 16px;
  }
  .np-badge {
    background-color: var(--primary-light); color: var(--primary);
    padding: 6px 12px; border-radius: 8px; font-weight: 700; font-size: 12px;
    display: flex; align-items: center; gap: 6px;
  }
  .np-dot { width: 8px; height: 8px; background-color: var(--primary); border-radius: 50%; animation: blink 1.5s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .np-title { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
  .np-sub { color: var(--text-muted); font-size: 14px; }
  .list-section {
    width: 420px; background-color: var(--surface-color); border-left: 1px solid var(--border-color);
    display: flex; flex-direction: column;
  }
  .list-header { padding: 20px 20px 10px 20px; }
  .list-title { font-size: 16px; font-weight: 700; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center;}
  .channel-count { color: var(--primary); background: var(--primary-light); padding: 2px 8px; border-radius: 12px; font-size: 12px; }
  .search-row { display: flex; gap: 8px; margin-bottom: 16px; }
  .search-box {
    flex: 1; padding: 12px 16px; border-radius: 10px; border: 1px solid var(--border-color); 
    background-color: var(--bg-color); color: var(--text-main); font-size: 14px; outline: none;
  }
  .search-box:focus { border-color: var(--primary); }
  .view-btn {
    width: 44px; border-radius: 10px; border: 1px solid var(--border-color);
    background-color: var(--bg-color); color: var(--text-main); cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: 0.2s;
  }
  .view-btn:hover { border-color: var(--primary); color: var(--primary); }
  .view-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; }
  .categories { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 10px; }
  .cat-btn {
    padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; white-space: nowrap; 
    cursor: pointer; border: 1px solid var(--border-color); background-color: var(--bg-color); color: var(--text-muted); transition: 0.2s;
  }
  .cat-btn:hover { color: var(--text-main); border-color: var(--text-muted); }
  .cat-btn.active { background-color: var(--primary); color: white; border-color: var(--primary); }
  
  .channel-list { flex: 1; overflow-y: auto; padding: 0 20px 20px 20px; display: flex; flex-direction: column; gap: 8px; }
  
  .channel-list.grid-view {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    align-content: start;
  }
  
  .channel-card {
    display: flex; align-items: center; justify-content: space-between; padding: 12px; border-radius: 12px; 
    cursor: pointer; background-color: var(--bg-color); border: 1px solid transparent; transition: 0.2s;
  }
  .channel-card:hover { border-color: var(--border-color); transform: translateY(-1px); }
  .channel-card.active { background-color: var(--primary-light); border-color: var(--primary); }
  
  .cc-logo {
    width: 42px; height: 42px; border-radius: 8px; flex-shrink: 0; margin-right: 12px;
    background: var(--surface-color); border: 1px solid var(--border-color);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
    font-weight: 700; color: var(--text-muted); font-size: 18px;
  }
  .channel-card.active .cc-logo { color: var(--primary); border-color: var(--primary); }
  .cc-logo img { width: 100%; height: 100%; object-fit: contain; padding: 4px; }
  
  .cc-info { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0; padding-right: 8px; }
  .cc-name { font-weight: 600; font-size: 14px; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .channel-card.active .cc-name { color: var(--primary); }
  .cc-cat { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  
  .channel-list.grid-view .channel-card {
    flex-direction: column; text-align: center; padding: 16px;
  }
  .channel-list.grid-view .cc-logo {
    margin: 0 0 12px 0; width: 56px; height: 56px; border-radius: 12px; font-size: 24px;
  }
  .channel-list.grid-view .cc-info {
    padding: 0; align-items: center; width: 100%;
  }
  .channel-list.grid-view .cc-actions {
    margin-top: 12px; width: 100%; justify-content: space-between;
  }

  .highlight { color: var(--primary); font-weight: 800; background: var(--primary-light); border-radius: 2px; padding: 0 2px;}
  .cc-actions { display: flex; align-items: center; gap: 8px; }
  .cc-quality {
    font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 6px;
    background-color: var(--surface-color); border: 1px solid var(--border-color); color: var(--text-muted);
  }
  .channel-card.active .cc-quality { background-color: var(--primary); color: white; border-color: var(--primary); }
  .fav-btn {
    background: transparent; border: none; color: var(--text-muted); cursor: pointer;
    display: flex; align-items: center; justify-content: center; padding: 4px; transition: 0.2s;
  }
  .fav-btn:hover { transform: scale(1.15); }
  .fav-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; transition: 0.2s;}
  .fav-btn.active svg { fill: #ef4444; stroke: #ef4444; }
  .empty-state { text-align: center; padding: 40px 0; color: var(--text-muted); font-size: 14px; }
  @media (max-width: 960px) {
    .container { flex-direction: column; overflow-y: auto; }
    .list-section { width: 100%; border-left: none; border-top: 1px solid var(--border-color); flex: none; }
    .channel-list { overflow: visible; padding-bottom: 40px; }
    .player-section { padding: 16px; flex: none; }
  }
</style>
</head>

    <button class="theme-btn" onclick="toggleTheme()" id="themeBtn" aria-label="Tema Değiştir"></button>
  </div>
</header>

<div class="container">
  <div class="player-section">
    <div class="player-wrapper">
      <div class="placeholder" id="placeholder">
        <div class="placeholder-icon">📺</div>
        <p>İzlemek istediğiniz kanalı listeden seçin</p>
      </div>
      <video id="videoPlayer" controls crossorigin playsinline></video>
    </div>
    <div class="now-playing" id="nowPlaying">
      <div class="np-badge"><div class="np-dot"></div> CANLI</div>
      <div>
        <div class="np-title" id="npTitle">Kanal Adı</div>
        <div class="np-sub" id="npSub">Kategori • Kalite</div>
      </div>
    </div>
  </div>

  <div class="list-section">
    <div class="list-header">
      <div class="list-title">
        <span>Canlı Kanallar</span>
        <span class="channel-count" id="channelCount">0</span>
      </div>
      <div class="search-row">
        <input type="text" class="search-box" id="searchInput" placeholder="Kanal veya Kategori ara..." onkeyup="renderChannels()">
        <button class="view-btn" id="viewToggleBtn" onclick="toggleView()" title="Görünümü Değiştir">
          <svg viewBox="0 0 24 24" id="viewIconList"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>
        </button>
      </div>
      <div class="categories" id="categoryList"></div>
    </div>
    <div class="channel-list" id="channelList"></div>
  </div>
</div>

<script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.3.5/hls.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dashjs/4.7.4/dash.all.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/plyr/3.7.8/plyr.min.js" crossorigin="anonymous"></script>

<script>
  function getSafeItem(key) { try { return localStorage.getItem(key); } catch(e){ return null; } }
  function setSafeItem(key, val) { try { localStorage.setItem(key, val); } catch(e){} }

  let favorites = [];
  try { favorites = JSON.parse(getSafeItem('panzer_favs') || '[]'); } catch(e){}

  let isGridView = getSafeItem('panzer_view') === 'grid';

  const sunIcon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>`;
  const moonIcon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>`;
  const listIcon = `<svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>`;
  const gridIcon = `<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>`;

  if (getSafeItem('theme') === 'light') {
    document.documentElement.removeAttribute('data-theme'); document.getElementById('themeBtn').innerHTML = moonIcon;
  } else { document.getElementById('themeBtn').innerHTML = sunIcon; }

  const rawData = document.getElementById('kolay-kanal-listesi').textContent;
  const lines = rawData.split('\n');
  const allChannels = [];
  const uniqueCategories = new Set(['Tümü']);

  lines.forEach((line, index) => {
    if (!line.trim()) return; 
    const parts = line.split('|').map(p => p.trim());
    const len = parts.length;
    
    if (len >= 2) {
      let name = parts[0], cat = "Diğer", quality = "HD", url = "", logo = null;
      if(len === 2) { url = parts[1]; }
      else if(len === 3) { cat = parts[1] || "Diğer"; url = parts[2]; }
      else if(len === 4) { cat = parts[1] || "Diğer"; quality = parts[2] || "HD"; url = parts[3]; }
      else if(len >= 5) { cat = parts[1] || "Diğer"; quality = parts[2] || "HD"; url = parts[3]; logo = parts[4]; }
      allChannels.push({ id: 'kanal_' + index, name, cat, quality, url, logo });
      uniqueCategories.add(cat); 
    }
  });

  let activeCategory = 'Tümü';
  let activeChannelId = null;

  window.__onGCastApiAvailable = function(isAvailable) {
    if (isAvailable) {
      cast.framework.CastContext.getInstance().setOptions({
        receiverApplicationId: chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID,
        autoJoinPolicy: chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED
      });
      document.getElementById('castBtn').style.display = 'block';
    }
  };

  function castCurrentVideo(url, title) {
    if(typeof cast === 'undefined') return;
    const session = cast.framework.CastContext.getInstance().getCurrentSession();
    if (session) {
      const mediaInfo = new chrome.cast.media.MediaInfo(url, url.includes('.mpd') ? 'application/dash+xml' : 'application/x-mpegurl');
      mediaInfo.metadata = new chrome.cast.media.GenericMediaMetadata();
      mediaInfo.metadata.title = title;
      const request = new chrome.cast.media.LoadRequest(mediaInfo);
      session.loadMedia(request).catch(err => console.log('Cast Hatası:', err));
    }
  }

  function renderCategories() {
    const catContainer = document.getElementById('categoryList');
    let catArray = Array.from(uniqueCategories);
    const digerIndex = catArray.indexOf("Diğer");
    if (digerIndex > -1) { catArray.splice(digerIndex, 1); catArray.push("Diğer"); }
    if (favorites.length > 0) { catArray.unshift('❤️ Favorilerim'); }
    if (!catArray.includes(activeCategory)) activeCategory = 'Tümü';

    catContainer.innerHTML = catArray.map(cat => `
      <button class="cat-btn ${activeCategory === cat ? 'active' : ''}" onclick="selectCategory('${cat}')">
        ${cat}
      </button>
    `).join('');
  }

  function selectCategory(cat) { activeCategory = cat; renderCategories(); renderChannels(); }

  function toggleFav(id, event) {
    event.stopPropagation();
    if(favorites.includes(id)) { favorites = favorites.filter(f => f !== id); } 
    else { favorites.push(id); }
    setSafeItem('panzer_favs', JSON.stringify(favorites));
    renderCategories();
    renderChannels();
  }

  function getHighlightedText(text, search) {
    if (!search) return text;
    const regex = new RegExp(`(${search})`, 'gi');
    return text.replace(regex, '<span class="highlight">$1</span>');
  }

  function toggleView() {
    isGridView = !isGridView;
    setSafeItem('panzer_view', isGridView ? 'grid' : 'list');
    renderChannels();
  }

  function renderChannels() {
    const searchTerm = document.getElementById('searchInput').value.toLowerCase();
    const listContainer = document.getElementById('channelList');
    const viewBtn = document.getElementById('viewToggleBtn');
    
    if (isGridView) {
      listContainer.classList.add('grid-view');
      viewBtn.innerHTML = listIcon;
    } else {
      listContainer.classList.remove('grid-view');
      viewBtn.innerHTML = gridIcon;
    }

    const filteredChannels = allChannels.filter(c => {
      if (activeCategory === '❤️ Favorilerim' && !favorites.includes(c.id)) return false;
      const matchCat = (activeCategory === 'Tümü' || activeCategory === '❤️ Favorilerim' || c.cat === activeCategory);
      const matchSearch = c.name.toLowerCase().includes(searchTerm) || c.cat.toLowerCase().includes(searchTerm);
      return matchCat && matchSearch;
    });

    document.getElementById('channelCount').textContent = filteredChannels.length;

    if (filteredChannels.length === 0) {
      listContainer.innerHTML = '<div class="empty-state">Kanal bulunamadı.</div>';
      return;
    }

    listContainer.innerHTML = filteredChannels.map(c => {
      const isFav = favorites.includes(c.id);
      const logoHtml = c.logo 
        ? `<img src="${c.logo}" alt="logo" onerror="this.outerHTML='<span>${c.name.charAt(0)}</span>'"/>` 
        : `<span>${c.name.charAt(0)}</span>`;

      return `
      <div class="channel-card ${activeChannelId === c.id ? 'active' : ''}" onclick="playChannel('${c.id}')">
        <div style="display:flex; align-items:center; flex:1; min-width:0; flex-direction: ${isGridView ? 'column' : 'row'};">
          <div class="cc-logo">${logoHtml}</div>
          <div class="cc-info">
            <div class="cc-name">${getHighlightedText(c.name, searchTerm)}</div>
            <div class="cc-cat">${getHighlightedText(c.cat, searchTerm)}</div>
          </div>
        </div>
        <div class="cc-actions">
          <div class="cc-quality">${c.quality}</div>
          <button class="fav-btn ${isFav ? 'active' : ''}" onclick="toggleFav('${c.id}', event)" title="Favorilere Ekle">
            <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
          </button>
        </div>
      </div>
    `}).join('');
  }

  renderCategories();
  renderChannels();

  const videoElement = document.getElementById('videoPlayer');
  let player;
  try {
    if (typeof Plyr !== 'undefined') {
      player = new Plyr(videoElement, {
        controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'captions', 'settings', 'pip', 'airplay', 'fullscreen'],
        settings: ['quality', 'speed'],
        fullscreen: { enabled: true, fallback: true, iosNative: true },
        i18n: { speed: 'Hız', normal: 'Normal', quality: 'Kalite', play: 'Oynat', pause: 'Duraklat', mute: 'Sessiz', unmute: 'Sesi Aç', enterFullscreen: 'Tam Ekran', exitFullscreen: 'Tam Ekrandan Çık' }
      });
    }
  } catch(e) {}

  let hls = null;
  let dashPlayer = null;

  function playChannel(id) {
    activeChannelId = id;
    const channel = allChannels.find(c => c.id === id);
    renderChannels();

    document.getElementById('placeholder').style.display = 'none';
    document.getElementById('nowPlaying').style.display = 'flex';
    document.getElementById('npTitle').textContent = channel.name;
    document.getElementById('npSub').textContent = `${channel.cat} • ${channel.quality}`;

    const url = channel.url;
    castCurrentVideo(url, channel.name); 

    if (hls) { hls.destroy(); }
    if (dashPlayer) { dashPlayer.destroy(); dashPlayer = null; }

    if (url.includes('.m3u8')) {
      if (typeof Hls !== 'undefined' && Hls.isSupported()) {
        hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(videoElement);
        hls.on(Hls.Events.MANIFEST_PARSED, function() { if(player) player.play().catch(e=>{}); });
        
        hls.on(Hls.Events.ERROR, function (event, data) {
          if (data.fatal) {
            switch (data.type) {
              case Hls.ErrorTypes.NETWORK_ERROR:
                console.warn("Ağ bağlantısı koptu, yeniden bağlanılıyor...");
                setTimeout(() => { hls.startLoad(); }, 3000);
                break;
              case Hls.ErrorTypes.MEDIA_ERROR:
                console.warn("Medya hatası kurtarılıyor...");
                hls.recoverMediaError();
                break;
              default:
                hls.destroy();
                break;
            }
          }
        });
      } else if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
        videoElement.src = url;
        videoElement.addEventListener('loadedmetadata', function() { if(player) player.play().catch(e=>{}); });
      }
    } else if (url.includes('.mpd')) {
      if (typeof dashjs !== 'undefined') {
        dashPlayer = dashjs.MediaPlayer().create();
        dashPlayer.initialize(videoElement, url, true);
        if(player) player.play().catch(e=>{});
      }
    } else {
      videoElement.src = url;
      if(player) player.play().catch(e=>{});
    }
  }

  function toggleTheme() {
    const html = document.documentElement;
    const btn = document.getElementById('themeBtn');
    if (html.getAttribute('data-theme') === 'dark') {
      html.removeAttribute('data-theme'); btn.innerHTML = moonIcon; setSafeItem('theme', 'light');
    } else {
      html.setAttribute('data-theme', 'dark'); btn.innerHTML = sunIcon; setSafeItem('theme', 'dark');
    }
  }
</script>
</body>
</html>
