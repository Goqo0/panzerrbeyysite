<style>
  :root {
    --bg-color: #0a0a0a; --surface-color: #171717; --text-main: #f9fafb; --text-muted: #9ca3af;
    --border-color: #262626; --primary: #22c55e; --primary-hover: #16a34a; --primary-light: #064e3b;
    --player-bg: #000000; --scroll-thumb: #404040;
  }
  [data-theme="light"] {
    --bg-color: #f3f4f6; --surface-color: #ffffff; --text-main: #111827; --text-muted: #6b7280;
    --border-color: #e5e7eb; --primary: #16a34a; --primary-hover: #15803d; --primary-light: #dcfce7;
    --player-bg: #000000; --scroll-thumb: #cbd5e1;
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
  
  body { 
    background-color: var(--bg-color); color: var(--text-main); 
    height: 100vh; display: flex; flex-direction: column; overflow: hidden;
    -webkit-user-select: none; user-select: none; 
  }
  
  header { 
    background-color: var(--surface-color); border-bottom: 1px solid var(--border-color); 
    height: 64px; display: flex; align-items: center; justify-content: space-between; 
    padding: 0 20px; flex-shrink: 0; z-index: 1000; 
    /* TV performans: GPU katmanı */
    transform: translateZ(0);
    will-change: auto;
  }
  .logo { display: flex; align-items: center; gap: 8px; font-size: 20px; }
  .logo-icon { background-color: var(--primary); color: white; width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 700; }
  .logo-text-panzer { color: var(--text-main); font-weight: 800; }
  .logo-text-sports { color: var(--primary); font-weight: 800; }
  
  .header-actions { display: flex; align-items: center; gap: 10px; }
  .theme-btn { 
    background: var(--surface-color); border: 1px solid var(--border-color); color: var(--text-main); 
    width: 40px; height: 40px; border-radius: 10px; cursor: pointer; 
    display: flex; align-items: center; justify-content: center;
    /* TV: animasyonu kaldır, sadece focus border değişsin */
    transition: border-color 0.15s, color 0.15s;
  }
  .theme-btn:hover { border-color: var(--primary); color: var(--primary); }

  .container { display: flex; flex: 1; width: 100%; overflow: hidden; }

  .left-content { 
    flex: 1.5; display: flex; flex-direction: column; overflow-y: auto; padding: 20px; gap: 20px;
    background-color: var(--bg-color);
    /* TV GPU hızlandırma */
    transform: translateZ(0);
    -webkit-overflow-scrolling: touch;
  }
  .player-wrapper { 
    background-color: var(--player-bg); border-radius: 16px; overflow: hidden;
    aspect-ratio: 16 / 9; position: relative; border: 1px solid var(--border-color);
    box-shadow: 0 10px 30px rgba(0,0,0,0.4); width: 100%; flex-shrink: 0;
    /* TV: transform kaldırıldı, sadece border geçişi */
    transition: border-color 0.15s ease;
  }
  
  #player, #ios-player-container, #embed-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; display: none; }
  #player { z-index: 5; }
  #ios-player-container { z-index: 6; background: #000; }
  #embed-container { z-index: 7; }
  
  #ios-video { width: 100%; height: 100%; object-fit: contain; }
  #embed-iframe { width: 100%; height: 100%; border: none; background: #000; }

  .placeholder { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; background: #0a0a0a; z-index: 20; }

  .banner-section { text-align: center; flex-shrink: 0; }
  .banner-section img { max-width: 100%; border-radius: 12px; border: 1px solid var(--border-color); }

  .right-content { 
    width: 420px; background-color: var(--bg-color); border-left: 1px solid var(--border-color); 
    display: flex; flex-direction: column; height: 100%; 
  }
  
  .tabs-container { background-color: var(--surface-color); display: flex; padding: 10px 16px 0 16px; gap: 10px; border-bottom: 1px solid var(--border-color); flex-shrink: 0; }
  .tab-btn { flex: 1; padding: 15px 5px; border: none; background: transparent; color: var(--text-muted); font-weight: 700; cursor: pointer; border-bottom: 3px solid transparent; font-size: 13px; text-transform: uppercase;
    transition: color 0.15s, border-color 0.15s; }
  .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
  
  .list-header { background-color: var(--surface-color); padding: 16px; flex-shrink: 0; }
  .search-box { width: 100%; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--border-color); background-color: var(--bg-color); color: var(--text-main); outline: none; }
  
  .channel-list { 
    flex: 1; 
    padding: 16px 16px 80px 16px;
    display: flex; 
    flex-direction: column; 
    gap: 10px; 
    overflow-y: auto; 
    background-color: var(--bg-color);
    /* TV GPU hızlandırma */
    transform: translateZ(0);
    -webkit-overflow-scrolling: touch;
  }
  .channel-list::-webkit-scrollbar { width: 6px; }
  .channel-list::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 10px; }

  /* TV: channel-card hover animasyonu kaldırıldı (yavaşlatıyordu) */
  .channel-card { display: flex; align-items: center; padding: 14px; border-radius: 12px; cursor: pointer; background-color: var(--surface-color); border: 1px solid var(--border-color);
    transition: border-color 0.1s; flex-shrink: 0; }
  .channel-card:hover { border-color: var(--primary); }
  .channel-card.active { border-color: var(--primary); background-color: var(--primary-light); }
  
  .cc-logo { width: 42px; height: 42px; border-radius: 8px; flex-shrink: 0; margin-right: 12px; background: #fff; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .cc-logo img { width: 100%; height: 100%; object-fit: contain; }

  @media (max-width: 960px) {
    .container { flex-direction: column; overflow: hidden; }
    .left-content { flex: none; padding: 12px; gap: 12px; height: auto; }
    .right-content { width: 100%; flex: 1; border-left: none; border-top: 1px solid var(--border-color); min-height: 0; }
    .channel-list { padding-bottom: 100px; }
  }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 2000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
  .modal-content { background: var(--surface-color); border-radius: 20px; width: 90%; max-width: 360px; padding: 24px; border: 1px solid var(--border-color); text-align: center; }
  .social-btn { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 14px; border-radius: 12px; text-decoration: none; font-weight: 700; color: white; margin-bottom: 12px; font-size: 14px; }
  .mail-area { background: var(--bg-color); padding: 15px; border-radius: 12px; border: 1px dashed var(--border-color); margin-bottom: 15px; }

  /* === TV KUMANDA ODAKLANMA (FOCUS) STİLLERİ === */
  .tv-focus {
    outline: 3px solid var(--primary) !important;
    box-shadow: 0 0 15px var(--primary) !important;
    /* TV: scale animasyonu kaldırıldı - yavaşlatıyordu */
    z-index: 100;
  }
  .player-wrapper.tv-focus {
    outline: 4px solid var(--primary) !important;
  }

  /* ================================================
     TV PLAYER KONTROL OVERLAY
     Player'ın üzerine binen, TV kumandayla
     fullscreen / ses aç-kapat / ses seviyesi
     butonlarını sağlayan şeffaf katman.
     Sadece isTV=true olduğunda gösterilir.
  ================================================ */
  #tv-player-controls {
    display: none; /* JS ile açılacak */
    position: absolute;
    bottom: 0; left: 0; right: 0;
    z-index: 30;
    background: linear-gradient(transparent, rgba(0,0,0,0.85));
    padding: 12px 16px 14px;
    align-items: center;
    gap: 10px;
    pointer-events: none; /* varsayılan: geçirgen, focuslanınca pointer-events: auto yapılacak */
  }
  #tv-player-controls.tv-focus-active {
    display: flex !important;
    pointer-events: auto;
  }
  .tv-ctrl-btn {
    background: rgba(255,255,255,0.15);
    border: 2px solid rgba(255,255,255,0.3);
    color: #fff;
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    min-width: 46px; min-height: 46px;
    transition: background 0.1s, border-color 0.1s;
    /* TV focus ring */
    outline: none;
  }
  .tv-ctrl-btn.tv-ctrl-focused {
    background: var(--primary);
    border-color: var(--primary);
    box-shadow: 0 0 10px var(--primary);
  }
  .tv-volume-bar-wrap {
    display: flex; align-items: center; gap: 6px; flex: 1;
  }
  .tv-volume-bar-bg {
    flex: 1; height: 6px; background: rgba(255,255,255,0.2); border-radius: 4px; overflow: hidden;
  }
  .tv-volume-bar-fill {
    height: 100%; background: var(--primary); border-radius: 4px;
    transition: width 0.1s;
  }
  .tv-volume-label {
    color: #fff; font-size: 12px; min-width: 28px; text-align: right;
  }
</style>
</head>

<header>

<div class="container">
  <div class="left-content" id="playerTop">

      <div class="placeholder" id="placeholder">

      <div id="player"></div>

        <video id="ios-video" playsinline webkit-playsinline controls autoplay muted></video>

        <iframe id="embed-iframe" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>

      <div id="tv-player-controls">

        <button class="tv-ctrl-btn" id="tv-btn-fullscreen" title="Tam Ekran">
          <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3m8 0h3a2 2 0 0 0 2-2v-3"/>
          </svg>
        </button>
        <!-- Ses Aç/Kapat -->
        <button class="tv-ctrl-btn" id="tv-btn-mute" title="Ses Aç/Kapat">
          <svg id="tv-vol-icon" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
          </svg>
        </button>
        <!-- Ses Azalt -->
        <button class="tv-ctrl-btn" id="tv-btn-vol-down" title="Sesi Azalt" style="font-size:20px;">−</button>
        <!-- Ses Çubuğu -->
        <div class="tv-volume-bar-wrap">
          <div class="tv-volume-bar-bg">
            <div class="tv-volume-bar-fill" id="tv-vol-bar" style="width:100%;"></div>
          </div>
          <span class="tv-volume-label" id="tv-vol-label">100</span>
        </div>
        <!-- Ses Artır -->
        <button class="tv-ctrl-btn" id="tv-btn-vol-up" title="Sesi Artır" style="font-size:20px;">+</button>
      </div>
    </div>
	 
    <div class="banner-section">
      <a href="https://refpa97757.com/L?tag=d_5396305m_65427c_&site=5396305&ad=65427" target="_blank">
        <img src="https://i.imgur.com/iUgXGdJ.gif" alt="Reklam">
      </a>
    </div>
  </div>

  <div class="right-content">
    <div class="tabs-container">
        <button class="tab-btn active" id="btn-channels" onclick="switchTab('channels')">CANLI KANALLAR</button>
        <button class="tab-btn" id="btn-matches" onclick="switchTab('matches')">MAÇ LİSTESİ</button>
    </div>

    <div class="list-header">
      <input type="text" class="search-box" id="searchInput" placeholder="Kanal veya maç ara..." onkeyup="renderCurrentList()">
    </div>

    <div class="channel-list" id="channelList"></div>
  </div>
</div>

<script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  // TV tespiti: Android TV, webOS, Tizen, Fire TV veya büyük ekran
  const isTV = /Android TV|SMART-TV|SmartTV|Tizen|webOS|NetCast|AFTS|AFTB|AFTMM|HbbTV/.test(navigator.userAgent)
    || (window.screen.width >= 1280 && !('ontouchstart' in window) && navigator.maxTouchPoints === 0);

  let activeId = null, clapprPlayer = null, currentTab = 'channels';

  const parse = (id, pre) => document.getElementById(id).textContent.split('\n').filter(l => l.trim()).map((l, i) => {
    const p = l.split('|').map(x => x.trim());
    return { id: pre + i, name: p[0], cat: p[1], qual: p[2], url: p[3], logo: p[4] || '' };
  });

  const channels = parse('kolay-kanal-listesi', 'ch');
  const matches = parse('kolay-mac-listesi', 'mt');

  function switchTab(t) {
    currentTab = t;
    document.getElementById('btn-channels').classList.toggle('active', t === 'channels');
    document.getElementById('btn-matches').classList.toggle('active', t === 'matches');
    renderCurrentList();
  }

  function renderCurrentList() {
    const list = currentTab === 'channels' ? channels : matches;
    const search = document.getElementById('searchInput').value.toLowerCase();
    const container = document.getElementById('channelList');
    container.innerHTML = list.filter(c => c.name.toLowerCase().includes(search)).map(c => `
      <div class="channel-card ${activeId === c.id ? 'active' : ''}" onclick="play('${c.id}')">
        ${currentTab === 'channels' ? `<div class="cc-logo"><img src="${c.logo}" onerror="this.src='https://via.placeholder.com/42'"></div>` : ''}
        <div><div style="font-weight:700; font-size:14px">${c.name}</div><div style="font-size:11px; color:var(--text-muted)">${c.cat} • ${c.qual}</div></div>
      </div>`).join('');
  }

  function play(id) {
    activeId = id;
    const item = [...channels, ...matches].find(c => c.id === id);
    renderCurrentList();
    
    // UI Sıfırlama
    document.getElementById('placeholder').style.display = 'none';
    document.getElementById('player').style.display = 'none';
    document.getElementById('ios-player-container').style.display = 'none';
    document.getElementById('embed-container').style.display = 'none';

    if (clapprPlayer) clapprPlayer.destroy();
    document.getElementById('player').innerHTML = "";
    document.getElementById('embed-iframe').src = "";
    
    const iosVideo = document.getElementById('ios-video');
    iosVideo.pause();
    iosVideo.src = "";
    iosVideo.load();

    const isHLS = item.url.includes('.m3u8') || item.url.includes('checklist') || item.url.includes('proxy') || item.url.includes('m3u');

    if (!isHLS) {
        document.getElementById('embed-container').style.display = 'block';
        document.getElementById('embed-iframe').src = item.url;
    } else if (isIOS) {
        document.getElementById('ios-player-container').style.display = 'block';
        iosVideo.src = item.url;
        iosVideo.load();
        iosVideo.muted = true;
        iosVideo.play().catch(e => console.log("Oynatma hatası:", e));
    } else {
        document.getElementById('player').style.display = 'block';
        clapprPlayer = new Clappr.Player({ 
            source: item.url, 
            mimeType: 'application/x-mpegURL',
            parentId: '#player', 
            width: '100%', 
            height: '100%', 
            autoPlay: true, 
            plugins: [HlsjsPlayback, LevelSelector],
            hlsjsConfig: { enableWorker: true }
        });
    }
  }

  function toggleTheme() {
    const d = document.documentElement;
    const isDark = d.getAttribute('data-theme') === 'dark';
    d.setAttribute('data-theme', isDark ? 'light' : 'dark');
    document.getElementById('themeBtn').innerHTML = isDark ? 
        '<svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path></svg>' : 
        '<svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"></circle><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path></svg>';
  }

  function openInfoModal() { document.getElementById('infoModal').style.display = 'flex'; }
  function closeInfoModal() { document.getElementById('infoModal').style.display = 'none'; }
  window.onload = renderCurrentList;

  // =====================================================================
  // TAM EKRAN YARDIMCI FONKSİYONU
  // =====================================================================
  function toggleFullScreen(elem) {
    if (!document.fullscreenElement && !document.mozFullScreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement) {
      if (elem.requestFullscreen) elem.requestFullscreen();
      else if (elem.msRequestFullscreen) elem.msRequestFullscreen();
      else if (elem.mozRequestFullScreen) elem.mozRequestFullScreen();
      else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
    } else {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.msExitFullscreen) document.msExitFullscreen();
      else if (document.mozCancelFullScreen) document.mozCancelFullScreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    }
  }

  // =====================================================================
  // TV PLAYER KONTROL OVERLAY: Ses ve Tam Ekran Yönetimi
  // Player'a odaklanıldığında (tv-focus) overlay gösterilir,
  // içindeki butonlar ayrıca kumandayla gezilir.
  // =====================================================================
  let tvVolume = 1.0;   // 0.0 - 1.0
  let tvMuted  = false;

  // Aktif video elementini döndürür (clappr veya ios-video)
  function getActiveVideoEl() {
    // Clappr oynatıcı varsa onun video etiketini al
    if (clapprPlayer) {
      const v = document.querySelector('#player video');
      if (v) return v;
    }
    // iOS video
    const iv = document.getElementById('ios-video');
    if (iv && iv.style.display !== 'none') return iv;
    return null;
  }

  function updateVolUI() {
    const pct = tvMuted ? 0 : Math.round(tvVolume * 100);
    document.getElementById('tv-vol-bar').style.width = pct + '%';
    document.getElementById('tv-vol-label').textContent = pct;
    // İkon: sessiz mi değil mi
    const icon = document.getElementById('tv-vol-icon');
    if (tvMuted || tvVolume === 0) {
      icon.innerHTML = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>';
    } else {
      icon.innerHTML = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>';
    }
  }

  function applyVolToVideo() {
    const v = getActiveVideoEl();
    if (v) {
      v.volume = tvVolume;
      v.muted  = tvMuted;
    }
  }

  // Kontrol buton tıklamaları
  document.getElementById('tv-btn-fullscreen').addEventListener('click', function(e) {
    e.stopPropagation();
    toggleFullScreen(document.getElementById('playerWrapper'));
  });
  document.getElementById('tv-btn-mute').addEventListener('click', function(e) {
    e.stopPropagation();
    tvMuted = !tvMuted;
    applyVolToVideo();
    updateVolUI();
  });
  document.getElementById('tv-btn-vol-down').addEventListener('click', function(e) {
    e.stopPropagation();
    tvVolume = Math.max(0, tvVolume - 0.1);
    tvMuted  = false;
    applyVolToVideo();
    updateVolUI();
  });
  document.getElementById('tv-btn-vol-up').addEventListener('click', function(e) {
    e.stopPropagation();
    tvVolume = Math.min(1, tvVolume + 0.1);
    tvMuted  = false;
    applyVolToVideo();
    updateVolUI();
  });

  // =====================================================================
  // TV KUMANDA NAVİGASYON DESTEĞİ
  // İki mod:
  //   "ana"       → sayfadaki tüm öğeler arası geziş
  //   "player"    → player'a odaklanıldığında overlay kontrolleri arası geziş
  // =====================================================================
  let tvFocusableElements = [];
  let tvFocusedIndex = -1;
  let tvMode = 'ana';  // 'ana' veya 'player'

  // Player overlay kontrol butonları
  const TV_CTRL_BTNS = ['tv-btn-fullscreen', 'tv-btn-mute', 'tv-btn-vol-down', 'tv-btn-vol-up'];
  let tvCtrlFocusedIndex = 0;

  function updateTVFocusableElements() {
    tvFocusableElements = Array.from(document.querySelectorAll(
      '.theme-btn, .player-wrapper, .tab-btn, #searchInput, .channel-card, .social-btn, .modal-content button'
    )).filter(el => el.offsetWidth > 0 && el.offsetHeight > 0 && window.getComputedStyle(el).display !== 'none');
  }

  function setCtrlBtnFocus(idx) {
    TV_CTRL_BTNS.forEach((id, i) => {
      document.getElementById(id).classList.toggle('tv-ctrl-focused', i === idx);
    });
  }

  function enterPlayerMode() {
    tvMode = 'player';
    tvCtrlFocusedIndex = 0;
    document.getElementById('tv-player-controls').classList.add('tv-focus-active');
    setCtrlBtnFocus(tvCtrlFocusedIndex);
  }

  function exitPlayerMode() {
    tvMode = 'ana';
    document.getElementById('tv-player-controls').classList.remove('tv-focus-active');
    TV_CTRL_BTNS.forEach(id => document.getElementById(id).classList.remove('tv-ctrl-focused'));
  }

  document.addEventListener('keydown', function(e) {
    const keys = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter', 'Backspace', 'Escape'];
    if (!keys.includes(e.key)) return;

    // Input alanında sol/sağ ok doğal çalışsın
    if (document.activeElement.tagName === 'INPUT' && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) return;

    e.preventDefault();

    // ---- PLAYER MOD (overlay kontrollerinde) ----
    if (tvMode === 'player') {
      if (e.key === 'Escape' || e.key === 'Backspace') {
        exitPlayerMode();
        return;
      }
      if (e.key === 'ArrowRight') {
        tvCtrlFocusedIndex = Math.min(tvCtrlFocusedIndex + 1, TV_CTRL_BTNS.length - 1);
        setCtrlBtnFocus(tvCtrlFocusedIndex);
        return;
      }
      if (e.key === 'ArrowLeft') {
        tvCtrlFocusedIndex = Math.max(tvCtrlFocusedIndex - 1, 0);
        setCtrlBtnFocus(tvCtrlFocusedIndex);
        return;
      }
      if (e.key === 'ArrowDown') {
        // Aşağı → ana moda dön
        exitPlayerMode();
        return;
      }
      if (e.key === 'Enter') {
        document.getElementById(TV_CTRL_BTNS[tvCtrlFocusedIndex]).click();
        return;
      }
      return;
    }

    // ---- ANA MOD ----
    updateTVFocusableElements();
    if (tvFocusableElements.length === 0) return;

    if (e.key === 'Enter') {
      if (tvFocusedIndex >= 0 && tvFocusableElements[tvFocusedIndex]) {
        const el = tvFocusableElements[tvFocusedIndex];
        if (el.classList.contains('player-wrapper')) {
          // Player'a Enter basıldığında → overlay kontrol moduna gir
          enterPlayerMode();
        } else {
          el.click();
          if (el.id === 'searchInput') el.focus();
        }
      }
      return;
    }

    if (tvFocusedIndex >= 0 && tvFocusableElements[tvFocusedIndex]) {
      tvFocusableElements[tvFocusedIndex].classList.remove('tv-focus');
      // Player'dan ayrılıyorsa overlay'i kapat
      if (tvFocusableElements[tvFocusedIndex].classList.contains('player-wrapper')) {
        exitPlayerMode();
      }
    }

    if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
      tvFocusedIndex++;
      if (tvFocusedIndex >= tvFocusableElements.length) tvFocusedIndex = tvFocusableElements.length - 1;
    } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
      tvFocusedIndex--;
      if (tvFocusedIndex < 0) tvFocusedIndex = 0;
    }

    const target = tvFocusableElements[tvFocusedIndex];
    if (target) {
      target.classList.add('tv-focus');
      target.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
  });

  // Sayfa içeriği değiştiğinde focusable listeyi güncelle
  const tvObserver = new MutationObserver(function() {
    updateTVFocusableElements();
    // Fokus indeks sınır kontrolü
    if (tvFocusedIndex >= tvFocusableElements.length) {
      tvFocusedIndex = tvFocusableElements.length - 1;
    }
  });
  tvObserver.observe(document.getElementById('channelList'), { childList: true });

</script>
</body>
