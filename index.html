<style>
  :root {
    --bg-color: #f3f4f6; --surface-color: #ffffff; --text-main: #111827; --text-muted: #6b7280;
    --border-color: #e5e7eb; --primary: #16a34a; --primary-hover: #15803d; --primary-light: #dcfce7;
    --player-bg: #000000; --scroll-thumb: #cbd5e1;
  }
  [data-theme="dark"] {
    --bg-color: #0a0a0a; --surface-color: #171717; --text-main: #f9fafb; --text-muted: #9ca3af;
    --border-color: #262626; --primary: #22c55e; --primary-hover: #16a34a; --primary-light: #064e3b;
    --player-bg: #000000; --scroll-thumb: #404040;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
  
  body { background-color: var(--bg-color); color: var(--text-main); transition: background-color 0.3s, color 0.3s; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
  
  header { background-color: var(--surface-color); border-bottom: 1px solid var(--border-color); height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; flex-shrink: 0; z-index: 1000; position: sticky; top: 0; }
  .logo { display: flex; align-items: center; gap: 10px; font-size: 22px; }
  .logo-icon { background-color: var(--primary); color: white; width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 20px; }
  .logo-text-panzer { color: var(--text-main); font-weight: 800; letter-spacing: -0.5px; }
  .logo-text-sports { color: var(--primary); font-weight: 800; letter-spacing: -0.5px; }
  
  .header-actions { display: flex; align-items: center; gap: 12px; }
  .theme-btn { background: var(--surface-color); border: 1px solid var(--border-color); color: var(--text-main); width: 42px; height: 42px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.3s; }
  
  .container { display: flex; flex: 1; max-width: 100%; margin: 0 auto; width: 100%; height: calc(100vh - 64px); }
  .player-section { flex: 1; padding: 24px; display: flex; flex-direction: column; overflow-y: auto; }
  
  .player-wrapper { 
    background-color: var(--player-bg); border-radius: 16px; overflow: hidden;
    aspect-ratio: 16 / 9; position: relative; border: 1px solid var(--border-color);
    box-shadow: 0 10px 30px rgba(0,0,0,0.2); width: 100%; flex-shrink: 0;
  }
  
  #player, #ios-player-container, #embed-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
  #ios-player-container, #embed-container { z-index: 10; display: none; background: #000; }
  #ios-video, #embed-iframe { width: 100%; height: 100%; border: none; }

  .placeholder { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; gap: 16px; background: #0a0a0a; z-index: 20; }

  .now-playing { margin-top: 20px; padding: 20px; background-color: var(--surface-color); border: 1px solid var(--border-color); border-radius: 16px; display: none; align-items: center; gap: 16px; flex-shrink: 0; }
  .np-badge { background-color: var(--primary-light); color: var(--primary); padding: 6px 12px; border-radius: 8px; font-weight: 700; font-size: 12px; display: flex; align-items: center; gap: 6px; }
  .np-dot { width: 8px; height: 8px; background-color: var(--primary); border-radius: 50%; }

  .banner-section { margin-top: 20px; text-align: center; flex-shrink: 0; }
  .banner-section img { max-width: 100%; border-radius: 12px; }

  /* KANAL LİSTESİ BÖLÜMÜ */
  .list-section { width: 400px; background-color: var(--surface-color); border-left: 1px solid var(--border-color); display: flex; flex-direction: column; height: 100%; }
  .list-header { padding: 20px; border-bottom: 1px solid var(--border-color); flex-shrink: 0; }
  .list-title { font-size: 16px; font-weight: 700; margin-bottom: 15px; color: var(--primary); display: flex; align-items: center; gap: 8px; }
  .search-box { width: 100%; padding: 12px 16px; border-radius: 10px; border: 1px solid var(--border-color); background-color: var(--bg-color); color: var(--text-main); outline: none; transition: 0.2s; }
  .search-box:focus { border-color: var(--primary); }
  
  /* SCROLLABLE ALAN */
  .channel-list { flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }

  /* ÖZEL SCROLLBAR */
  .channel-list::-webkit-scrollbar, .player-section::-webkit-scrollbar { width: 6px; }
  .channel-list::-webkit-scrollbar-track, .player-section::-webkit-scrollbar-track { background: transparent; }
  .channel-list::-webkit-scrollbar-thumb, .player-section::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 10px; }
  
  .channel-card { display: flex; align-items: center; padding: 12px; border-radius: 12px; cursor: pointer; background-color: var(--bg-color); border: 1px solid transparent; transition: 0.2s; }
  .channel-card:hover { border-color: var(--border-color); transform: translateY(-1px); }
  .channel-card.active { background-color: var(--primary-light); border-color: var(--primary); }
  
  .cc-logo { width: 44px; height: 44px; border-radius: 8px; flex-shrink: 0; margin-right: 12px; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #fff; }
  .cc-logo img { width: 100%; height: 100%; object-fit: contain; }

  .footer-contact { padding: 15px; border-top: 1px solid var(--border-color); text-align: center; flex-shrink: 0; }

  .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.7); z-index: 2000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
  .modal-content { background-color: var(--surface-color); border-radius: 20px; width: 90%; max-width: 380px; padding: 24px; position: relative; border: 1px solid var(--border-color); }
  .social-btn { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 14px; border-radius: 12px; text-decoration: none; font-weight: 600; color: white; margin-bottom: 12px; transition: 0.2s; }

  @media (max-width: 960px) {
    body { height: auto; overflow: visible; }
    .container { flex-direction: column; height: auto; }
    .list-section { width: 100%; border-left: none; height: 600px; border-top: 1px solid var(--border-color); }
    .player-section { padding: 16px; overflow-y: visible; }
  }
</style>
</head>

      <div class="np-badge"><div class="np-dot"></div> CANLI YAYIN</div>
      <div><div id="npTitle" style="font-weight:700; font-size:18px">Kanal</div><div id="npSub" style="font-size:13px; color:var(--text-muted)">Kategori</div></div>
    </div>
  </div>

    <div class="list-header">
      <div class="list-title"><span></span> Canlı Kanallar</div>

    <a href="https://t.me/xpanzerrbeyy" target="_blank" class="social-btn" style="background: #229ED9;">Telegram Kanalımız</a>

    <button onclick="closeInfoModal()" style="width:100%; padding:12px; border:none; background:var(--primary); color:white; border-radius:10px; cursor:pointer; font-weight:700; margin-top:10px">Kapat</button>
  </div>
</div>

<script>
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  let activeChannelId = null;
  let clapprPlayer = null;

  const rawData = document.getElementById('kolay-kanal-listesi').textContent;
  const allChannels = [];
  rawData.split('\n').filter(l => l.trim()).forEach((line, index) => {
    const parts = line.split('|').map(p => p.trim());
    if (parts.length >= 4) {
      allChannels.push({ id: 'chan_'+index, name: parts[0], cat: parts[1], quality: parts[2], url: parts[3], logo: parts[4] });
    }
  });

  function renderChannels() {
    const search = document.getElementById('searchInput').value.toLowerCase();
    const filtered = allChannels.filter(c => c.name.toLowerCase().includes(search));
    document.getElementById('channelList').innerHTML = filtered.map(c => `
      <div class="channel-card ${activeChannelId === c.id ? 'active' : ''}" onclick="playChannel('${c.id}')">
        <div class="cc-logo"><img src="${c.logo}" onerror="this.src='https://via.placeholder.com/44?text=P'"></div>
        <div><div style="font-weight:600; font-size:14px">${c.name}</div><div style="font-size:11px; color:var(--text-muted)">${c.cat} • ${c.quality}</div></div>
      </div>`).join('');
  }

  function playChannel(id) {
    activeChannelId = id;
    const channel = allChannels.find(c => c.id === id);
    renderChannels();
    
    window.scrollTo({ top: 0, behavior: 'smooth' });

    document.getElementById('placeholder').style.display = 'none';
    document.getElementById('nowPlaying').style.display = 'flex';
    document.getElementById('npTitle').textContent = channel.name;
    document.getElementById('npSub').textContent = `${channel.cat} • ${channel.quality}`;
    
    if (clapprPlayer) { clapprPlayer.destroy(); clapprPlayer = null; }
    document.getElementById('ios-player-container').style.display = 'none';
    document.getElementById('embed-container').style.display = 'none';

    const isDirectStream = channel.url.includes('.m3u8') || channel.url.includes('.mpd');

    if (!isDirectStream) {
        document.getElementById('embed-container').style.display = 'block';
        document.getElementById('embed-iframe').src = channel.url;
    } else if (isIOS) {
        document.getElementById('ios-player-container').style.display = 'block';
        const v = document.getElementById('ios-video'); v.src = channel.url; v.play();
    } else {
        clapprPlayer = new Clappr.Player({
          source: channel.url, parentId: '#player', width: '100%', height: '100%', autoPlay: true,
          plugins: [HlsjsPlayback, LevelSelector],
          playback: { playInline: true, crossOrigin: 'anonymous' }
        });
    }
  }

  function toggleTheme() {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
    document.getElementById('themeBtn').innerHTML = isDark ? moonIcon : sunIcon;
  }
  
  const sunIcon = `<svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"></circle><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path></svg>`;
  const moonIcon = `<svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path></svg>`;

  function openInfoModal() { document.getElementById('infoModal').style.display = 'flex'; }
  function closeInfoModal() { document.getElementById('infoModal').style.display = 'none'; }

  window.onload = () => { 
    document.getElementById('themeBtn').innerHTML = sunIcon;
    renderChannels(); 
  };
</script>
</body>
